[package]
name = "maarco"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "maarco_yaw_wptrack"
path = "src/bin/main.rs"

[[bin]]
name = "maarco_orig"
path = "src/bin/main_orig.rs"

[[bin]]
name = "maarco_pred_yaw"
path = "src/bin/main_pred_yaw.rs"

[[bin]]
name = "maarco_EKF"
path = "src/bin/main_EKF.rs"


[dependencies]
base64 = "0.22.1"
chrono = "0.4.42"
clap = { version = "4.5.48", features = ["derive"] }
clap_derive = "4.5.47"
cross = "0.2.5"
crossterm = "0.29.0"
csv = "1.3.1"
ctrlc = "3.5.2"
nalgebra = "0.32"
eyre = "0.6.12"
nmea = { version = "0.7.0", features = ["default", "serde"] }
rppal = "0.22.1"
serde = "1.0.228"
serialport = { version = "4.7.3", default-features = false }
