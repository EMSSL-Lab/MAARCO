[package]
name = "maarco"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
chrono = "0.4.42"
clap = { version = "4.5.48", features = ["derive"] }
clap_derive = "4.5.47"
cross = "0.2.5"
crossterm = "0.29.0"
csv = "1.3.1"
